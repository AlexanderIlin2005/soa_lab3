services:
  pg:
    image: postgres:16
    container_name: lab3-pg
    environment:
      POSTGRES_USER: soa
      POSTGRES_PASSWORD: soa
      POSTGRES_DB: studs
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soa -d studs"]
      interval: 3s
      timeout: 3s
      retries: 20

  eureka:
    image: eclipse-temurin:17-jre
    container_name: lab3-eureka
    ports:
      - "38761:38761"
    volumes:
      - ./lab3-cloud/eureka-server/build/libs/eureka-server.jar:/app/eureka-server.jar:ro
    environment:
      EUREKA_PORT: "38761"
    command: ["java", "-jar", "/app/eureka-server.jar"]

  config-server:
    image: eclipse-temurin:17-jre
    container_name: lab3-config-server
    ports:
      - "38888:38888"
    volumes:
      - ./lab3-cloud/config-server/build/libs/config-server.jar:/app/config-server.jar:ro
    environment:
      CONFIG_PORT: "38888"
      EUREKA_URL: "http://eureka:38761/eureka/"
    command: ["java", "-jar", "/app/config-server.jar"]
    depends_on:
      - eureka

  api-gateway:
    image: eclipse-temurin:17-jre
    container_name: lab3-api-gateway
    ports:
      - "38080:38080"
    volumes:
      - ./lab3-cloud/api-gateway/build/libs/api-gateway.jar:/app/api-gateway.jar:ro
    environment:
      GATEWAY_PORT: "38080"
      EUREKA_URL: "http://eureka:38761/eureka/"
    command: ["java", "-jar", "/app/api-gateway.jar"]
    depends_on:
      - eureka

  vehicle-registrar:
    image: eclipse-temurin:17-jre
    container_name: lab3-vehicle-registrar
    ports:
      - "38090:38090"
    volumes:
      - ./lab3-cloud/vehicle-registrar/build/libs/vehicle-registrar.jar:/app/vehicle-registrar.jar:ro
    environment:
      REGISTRAR_PORT: "38090"
      EUREKA_URL: "http://lab3-eureka:38761/eureka/"
      VEHICLE_SERVICE_HOST: "sandbox-payara"
      VEHICLE_SERVICE_PORT: "8080"
    command: ["java", "-jar", "/app/vehicle-registrar.jar"]
    depends_on:
      - eureka


  shop-service-1:
    image: eclipse-temurin:17-jre
    container_name: lab3-shop-1
    ports:
      - "38001:8080"
    volumes:
      - ./docker/payara-micro/payara-micro.jar:/app/payara-micro.jar:ro
      - ./shop-service/build/libs/shop-service.war:/app/shop-service.war:ro
    environment:
      VEHICLE_SERVICE_URL: "http://lab3-api-gateway:38080/vehicle-service"
    command: ["java", "-jar", "/app/payara-micro.jar", "--deploy", "/app/shop-service.war", "--port", "8080", "--noCluster"]
    depends_on:
      - api-gateway

  shop-service-2:
    image: eclipse-temurin:17-jre
    container_name: lab3-shop-2
    ports:
      - "38002:8080"
    volumes:
      - ./docker/payara-micro/payara-micro.jar:/app/payara-micro.jar:ro
      - ./shop-service/build/libs/shop-service.war:/app/shop-service.war:ro
    environment:
      VEHICLE_SERVICE_URL: "http://lab3-api-gateway:38080/vehicle-service"
    command: ["java", "-jar", "/app/payara-micro.jar", "--deploy", "/app/shop-service.war", "--port", "8080", "--noCluster"]
    depends_on:
      - api-gateway

  haproxy:
    image: haproxy:2.9-alpine
    container_name: lab3-haproxy
    ports:
      - "28681:28681"
      - "8404:8404"
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - shop-service-1
      - shop-service-2


volumes:
  pgdata:
