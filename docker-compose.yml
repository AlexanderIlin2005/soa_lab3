# Локальный стенд для отладки лабы 3.
#
# Что поднимается:
#   - pg            : PostgreSQL 16 (БД для vehicle-service)
#   - eureka        : Eureka Server (Service Discovery)
#   - config-server : Spring Cloud Config Server (внешние конфиги)
#   - api-gateway   : Spring Cloud Gateway (проксирование к сервисам)
#
# vehicle-service и shop-service запускаются отдельно через docker run
# (они WAR'ы в Payara Micro), см. README / fix.sh.
#
# Запуск:   docker compose up -d
# Логи:     docker compose logs -f <name>
# Остановка: docker compose down
# Полная очистка (включая БД): docker compose down -v

services:
  pg:
    image: postgres:16
    container_name: lab3-pg
    environment:
      POSTGRES_USER: soa
      POSTGRES_PASSWORD: soa
      POSTGRES_DB: studs
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soa -d studs"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Полная Payara — оставлена для сравнения, но не используется.
  # Наш рабочий vehicle-service запускается через docker run (Payara Micro).
  payara-vehicle:
    image: payara/server-full:6.2025.11-jdk17
    container_name: lab3-payara-vehicle
    profiles: ["full-payara"]   # НЕ поднимается при обычном docker compose up
    depends_on:
      pg:
        condition: service_healthy
    environment:
      AS_ADMIN_PASSWORD: adminadmin
      POSTBOOT_COMMANDS: /opt/payara/custom/post-boot-commands.asadmin
      PREBOOT_COMMANDS:  /opt/payara/custom/pre-boot-commands.asadmin
      EUREKA_URL:  "http://eureka:38761/eureka/"
      EUREKA_HOST: "localhost"
    ports:
      - "28581:8181"
      - "28582:8080"
      - "127.0.0.1:28548:4848"
    volumes:
      - ./docker/payara-vehicle:/opt/payara/custom:ro
      - ./docker/payara-vehicle/postgresql.jar:/opt/payara/appserver/glassfish/domains/domain1/lib/postgresql.jar:ro
      - ./vehicle-service/build/libs/vehicle-service.war:/opt/payara/deployments/vehicle-service.war:ro

  eureka:
    image: eclipse-temurin:17-jre
    container_name: lab3-eureka
    ports:
      - "38761:38761"
    volumes:
      - ./lab3-cloud/eureka-server/build/libs/eureka-server.jar:/app/eureka-server.jar:ro
    environment:
      EUREKA_PORT: "38761"
    command: ["java", "-jar", "/app/eureka-server.jar"]

  config-server:
    image: eclipse-temurin:17-jre
    container_name: lab3-config-server
    ports:
      - "38888:38888"
    volumes:
      - ./lab3-cloud/config-server/build/libs/config-server.jar:/app/config-server.jar:ro
    environment:
      CONFIG_PORT: "38888"
      EUREKA_URL: "http://eureka:38761/eureka/"
    command: ["java", "-jar", "/app/config-server.jar"]
    depends_on:
      - eureka

  api-gateway:
    image: eclipse-temurin:17-jre
    container_name: lab3-api-gateway
    ports:
      - "38080:38080"
    volumes:
      - ./lab3-cloud/api-gateway/build/libs/api-gateway.jar:/app/api-gateway.jar:ro
    environment:
      GATEWAY_PORT: "38080"
      EUREKA_URL: "http://eureka:38761/eureka/"
    command: ["java", "-jar", "/app/api-gateway.jar"]
    depends_on:
      - eureka

  vehicle-registrar:
    image: eclipse-temurin:17-jre
    container_name: lab3-vehicle-registrar
    ports:
      - "38090:38090"
    volumes:
      - ./lab3-cloud/vehicle-registrar/build/libs/vehicle-registrar.jar:/app/vehicle-registrar.jar:ro
    environment:
      REGISTRAR_PORT: "38090"
      EUREKA_URL: "http://lab3-eureka:38761/eureka/"
      VEHICLE_SERVICE_HOST: "sandbox-payara"
      VEHICLE_SERVICE_PORT: "8080"
    command: ["java", "-jar", "/app/vehicle-registrar.jar"]
    depends_on:
      - eureka


volumes:
  pgdata:
