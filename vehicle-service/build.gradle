plugins {
    id 'war'
    alias(libs.plugins.openapi.generator)
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

configurations.configureEach {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    exclude group: 'com.fasterxml.jackson.module', module: 'jackson-module-jakarta-xmlbind-annotations'
    resolutionStrategy {
        // Подмена координат — сильнее, чем force, и обходит BOM Spring Boot.
        // Прижимаем версию Jackson в WAR к той, что даёт Payara 6.2025.11,
        // чтобы модуль JakartaXmlBindAnnotationModule из Payara
        // наследовался от Module из WAR без VerifyError.
        dependencySubstitution {
            substitute module('com.fasterxml.jackson.core:jackson-core') using module('com.fasterxml.jackson.core:jackson-core:2.20.0')
            substitute module('com.fasterxml.jackson.core:jackson-databind') using module('com.fasterxml.jackson.core:jackson-databind:2.20.0')
            substitute module('com.fasterxml.jackson.core:jackson-annotations') using module('com.fasterxml.jackson.core:jackson-annotations:2.20')
            substitute module('com.fasterxml.jackson.dataformat:jackson-dataformat-xml') using module('com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.20.0')
            substitute module('com.fasterxml.jackson.dataformat:jackson-dataformat-yaml') using module('com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.20.0')
            substitute module('com.fasterxml.jackson.datatype:jackson-datatype-jsr310') using module('com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.20.0')
            substitute module('com.fasterxml.jackson.datatype:jackson-datatype-jdk8') using module('com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.20.0')
            substitute module('com.fasterxml.jackson.module:jackson-module-parameter-names') using module('com.fasterxml.jackson.module:jackson-module-parameter-names:2.20.0')
        }
    }
}

dependencies {
    implementation platform(libs.spring.boot.dependencies)
    // implementation platform(libs.springCloudDependencies)

    implementation(libs.spring.boot.starter.web) {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    }
    implementation libs.spring.boot.starter.data.jpa
    implementation libs.spring.boot.starter.validation

    // implementation libs.springCloudStarterEurekaClient
    // implementation libs.springCloudStarterConfig

    implementation libs.jackson.dataformat.xml
    implementation libs.jackson.dataformat.yaml
    implementation libs.flyway.core
    implementation libs.flyway.database.postgresql
    implementation libs.postgresql

    implementation "ch.qos.logback:logback-classic"

    providedCompile libs.jakarta.servlet.api
    providedCompile libs.jakarta.validation.api
    providedCompile libs.jakarta.annotation.api

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testImplementation libs.spring.boot.starter.test
    testRuntimeOnly libs.junit.platform.launcher
}

def generatedSources = layout.buildDirectory.dir('generated/openapi')

openApiGenerate {
    generatorName = 'spring'
    inputSpec = rootProject.file('openapi/vehicle-service.yaml').absolutePath
    outputDir = generatedSources.get().asFile.absolutePath
    cleanupOutput = true
    templateDir = file('openapi-templates').absolutePath
    apiPackage = 'org.itmo.vehicle.infrastructure.web.generated.api'
    modelPackage = 'org.itmo.vehicle.infrastructure.web.generated.model'
    modelNameSuffix = 'Dto'
    globalProperties = [apis: '', models: '']
    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = false
    generateModelDocumentation = false
    configOptions = [
            interfaceOnly             : 'true',
            skipDefaultInterface      : 'true',
            useSpringBoot3            : 'true',
            useTags                   : 'true',
            useBeanValidation         : 'true',
            useSpringBuiltInValidation: 'true',
            openApiNullable           : 'false',
            documentationProvider     : 'none',
            annotationLibrary         : 'none',
            dateLibrary               : 'java8',
            hideGenerationTimestamp   : 'true',
            sourceFolder              : 'src/main/java',
    ]
}

sourceSets.main.java.srcDir(generatedSources.map { it.dir('src/main/java') })
tasks.named('compileJava') { dependsOn tasks.named('openApiGenerate') }

tasks.named('test') { useJUnitPlatform() }

war {
    archiveFileName = 'vehicle-service.war'
}

tasks.named('bootWar') { enabled = false }
