spring:
  jackson:
    find-modules: false
  application:
    name: vehicle-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://config-server:38888}"
  datasource:
    url: jdbc:postgresql://pg:5432/studs
    username: soa
    password: soa
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Hibernate 6 при создании FormatMapper вызывает
        # ObjectMapper.findAndRegisterModules(), который через ServiceLoader
        # находит JakartaXmlBindAnnotationModule из Payara и падает с
        # "not a subtype" (разные classloader'ы). Наш NoScanJsonFormatMapper
        # этого не делает.
        type:
          json_format_mapper: org.itmo.vehicle.infrastructure.persistence.NoScanJsonFormatMapper
  flyway:
    enabled: true
    schemas: soa
    table: soa_flyway_history
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration

soa:
  db-schema: soa
  cors:
    allowed-origins: ""

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:38761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 28581
    status-page-url:  https://${EUREKA_HOST:localhost}:28581/vehicle-service/actuator/info
    health-check-url: https://${EUREKA_HOST:localhost}:28581/vehicle-service/actuator/health

logging:
  level:
    org.springframework.web: INFO
    com.netflix.discovery: INFO
