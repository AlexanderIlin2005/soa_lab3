global
    maxconn 1024
    log /dev/log local0

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option httplog
    option forwardfor
    retries 2
    option redispatch 1
    default-server check inter 3s fall 3 rise 2

frontend vehicle
    bind *:28581 ssl crt /etc/haproxy/soa.pem
    http-request set-header X-Forwarded-Proto https
    default_backend gateway

frontend shop
    bind *:28681 ssl crt /etc/haproxy/soa.pem
    http-request set-header X-Forwarded-Proto https
    http-request redirect location /client/ if { path / }
    acl wildfly path_beg /client /swagger /shop-soap
    use_backend wildfly if wildfly
    default_backend rest

backend gateway
    option httpchk GET /actuator/health
    server gateway 127.0.0.1:38080

backend wildfly
    server wildfly 127.0.0.1:8180

backend rest
    server mule 127.0.0.1:8091

frontend stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /
    stats refresh 5s
