spring:
  application:
    name: shop-service
  mvc:
    servlet:
      load-on-startup: 1
  jackson:
    deserialization:
      adjust-dates-to-context-time-zone: false

vehicle-service:
  base-url: ${VEHICLE_SERVICE_URL:http://sandbox-payara:8080/vehicle-service}
  connect-timeout: 2s
  read-timeout: 5s

soa:
  cors:
    allowed-origins: "${CORS_ORIGINS:}"
