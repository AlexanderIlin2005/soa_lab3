plugins {
    id 'war'
}

dependencies {
    providedCompile "jakarta.platform:jakarta.jakartaee-api:${libs.versions.jakartaee.get()}"
    providedCompile 'jakarta.xml.ws:jakarta.xml.ws-api:4.0.2'
    providedCompile 'jakarta.jws:jakarta.jws-api:3.0.0'

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
}

war {
    archiveFileName = 'shop-soap.war'
}
