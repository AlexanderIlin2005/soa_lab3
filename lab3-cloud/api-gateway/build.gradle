plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

dependencies {
    implementation platform(libs.springCloudDependencies)
    implementation libs.springCloudStarterGateway
    implementation libs.springCloudStarterEurekaClient
    implementation libs.springCloudStarterLoadbalancer
}

tasks.named('bootJar') { archiveFileName = 'api-gateway.jar' }
tasks.named('test')    { useJUnitPlatform() }
