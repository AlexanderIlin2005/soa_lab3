global
    daemon
    maxconn 4096

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option httplog
    log stdout format raw local0

frontend shop
    bind *:28681
    default_backend shop_backend

backend shop_backend
    balance roundrobin
    option httpchk GET /shop-service/actuator/health
    http-check expect status 200

    # Заголовок X-Upstream — по нему в ответе видно, какой экземпляр ответил
    http-response set-header X-Upstream %[srv_name]

    server shop1 shop-service-1:8080 check inter 3s fall 3 rise 2
    server shop2 shop-service-2:8080 check inter 3s fall 3 rise 2

# Статистика HAProxy на 8404 для диагностики
frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
